---
# cPanel deployment
# ---------------------------------------------------------------------
# This runs on the server every time you press "Update from Remote", just
# after the pull.
#
# ---------------------------------------------------------------------
# YOU DO NOT NEED TO EDIT ANYTHING.
#
# On this account cPanel pulls the repository straight into the folder the
# domain serves, so there is nothing to copy anywhere — the files are
# already where Apache reads them. That was confirmed against the live
# site, which is answering with the .htaccess committed in this
# repository. So the default below copies nothing, and instead does the
# step that actually gets forgotten — applying pending database changes.
#
# Only set DEPLOYPATH if your account is arranged the other way, with the
# repository pulled into one folder and the site served from another. Put
# the served folder (cPanel, then Domains, then the "Document Root"
# column) in the quotes on the DEPLOYPATH line, and the files will be
# copied there.
# ---------------------------------------------------------------------
#
# What is deliberately never touched, wherever it deploys:
#
#   config/config.php   the live database password
#   storage/            every upload, backup and log
#
# A deployment that overwrote either would take the site down and lose the
# attachments with it.

deployment:
  tasks:
    - export DEPLOYPATH=""
    - export SOURCE=$(pwd)
    - export PHPBIN=$(command -v php || echo /bin/php)

    # ---------------------------------------------------------------
    # 1. Copy the files, if and only if there is somewhere to copy to
    # ---------------------------------------------------------------
    # Copying a folder onto itself with --delete would empty it partway
    # through, taking .git with it and leaving no repository to deploy
    # from again. Refuse rather than find out.
    - if [ -n "$DEPLOYPATH" ] && [ "$(cd "$SOURCE" && pwd -P)" = "$(cd "$DEPLOYPATH" 2>/dev/null && pwd -P)" ]; then
        echo "DEPLOYPATH is the repository folder itself. Leave it empty, because the files are already in place.";
        exit 1;
      fi

    - if [ -n "$DEPLOYPATH" ] && [ ! -d "$DEPLOYPATH" ]; then
        echo "DEPLOYPATH does not exist, check cPanel > Domains > Document Root. Value was $DEPLOYPATH";
        exit 1;
      fi

    # The repository layout is copied as it stands, with index.php inside
    # public/ and the .htaccess beside this file handing requests into
    # it. That is the arrangement the site is verified to run under, so
    # the deployed copy is the tested copy.
    - if [ -n "$DEPLOYPATH" ]; then
        rsync -a --delete
          --exclude '.git/' --exclude 'deploy/' --exclude 'tests/' --exclude 'node_modules/'
          --exclude 'storage/' --exclude 'config/config.php'
          "$SOURCE/" "$DEPLOYPATH/"
        && echo "Copied the site to $DEPLOYPATH";
      else
        export DEPLOYPATH="$SOURCE";
        echo "Serving straight from the repository folder, nothing to copy.";
      fi

    # ---------------------------------------------------------------
    # 2. The folders the application writes to
    # ---------------------------------------------------------------
    # On a first deployment these do not exist yet, and uploads then fail
    # with nothing in the log to say why.
    - mkdir -p "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/storage/uploads" "$DEPLOYPATH/storage/backups"
    - chmod -R 755 "$DEPLOYPATH/storage" || true

    # ---------------------------------------------------------------
    # 3. Apply pending database changes
    # ---------------------------------------------------------------
    # New code against an old database is the other way a deployment
    # looks like it did nothing. The pages arrive, and half of them fail
    # on a column that is not there yet. migrate.php keeps a ledger and
    # skips what has already run, so this is safe to repeat, and it stops
    # on the first failure rather than pressing on.
    - if [ ! -f "$DEPLOYPATH/config/config.php" ]; then
        echo "There is no config/config.php yet, so the database was left alone. Upload your config and deploy again.";
      elif "$PHPBIN" "$DEPLOYPATH/migrate.php"; then
        echo "The database is up to date.";
      else
        echo "A migration failed. The files are deployed but the database is behind. Fix the error above and press Update from Remote again.";
        exit 1;
      fi

    - echo "Deployed."
