---
# cPanel deployment
# ---------------------------------------------------------------------
# Without this file, cPanel's "Update from Remote" pulls the code into the
# repository folder and stops. It copies nothing to the folder your site
# is served from, which is why a push can succeed and change nothing you
# can see.
#
# ---------------------------------------------------------------------
# BEFORE THIS WORKS, SET DEPLOYPATH BELOW TO YOUR OWN FOLDER.
#
# It is the directory your domain or subdomain actually serves. Find it in
# cPanel under Domains, in the "Document Root" column. It usually looks
# like one of these:
#
#     /home/USERNAME/public_html
#     /home/USERNAME/public_html/system
#     /home/USERNAME/system.shanfix.co.ke
#
# Replace USERNAME and the folder with yours. Everything else can stay.
# ---------------------------------------------------------------------
#
# What this does, in order:
#
#   1. Builds the flat package with build-cpanel.php. The repository keeps
#      index.php inside public/, which expects the document root to point
#      there. On shared hosting that often cannot be changed, so the flat
#      build puts index.php at the top instead and protects the folders
#      that must never be served with .htaccess deny rules.
#
#   2. Copies the built files over the live folder.
#
#   3. Leaves config/config.php and storage/ alone. Those hold the live
#      database password and every uploaded file, backup and log — a
#      deployment that overwrote them would take the site down and lose
#      the attachments with it.
#
# After it runs, open https://your-domain/upgrade.php and apply any
# pending database changes. New code against an old database is the other
# way a deployment looks like it did nothing.

deployment:
  tasks:
    - export DEPLOYPATH=/home/USERNAME/public_html
    - export SOURCE=$(pwd)

    # Build the flat package into deploy/ inside the repository.
    - /bin/php "$SOURCE/build-cpanel.php" || php "$SOURCE/build-cpanel.php"

    # Refuse rather than half-deploy: copying into a folder that does not
    # exist would scatter files somewhere nobody thinks to look.
    - /bin/test -d "$DEPLOYPATH" || { echo "DEPLOYPATH does not exist: $DEPLOYPATH — edit .cpanel.yml"; exit 1; }

    # Keep what must survive a deployment.
    - /bin/mkdir -p "$DEPLOYPATH/config" "$DEPLOYPATH/storage"
    - /bin/cp -f "$DEPLOYPATH/config/config.php" /tmp/shanfix-config-backup.php 2>/dev/null || true

    # Copy the build over the live folder. storage/ and config/config.php
    # are excluded, so uploads, backups, logs and the live database
    # credentials are all left as they are.
    - /bin/rsync -a --delete
        --exclude 'storage/'
        --exclude 'config/config.php'
        "$SOURCE/deploy/" "$DEPLOYPATH/"

    # Put the live config back if anything disturbed it.
    - /bin/test -f "$DEPLOYPATH/config/config.php" || /bin/cp -f /tmp/shanfix-config-backup.php "$DEPLOYPATH/config/config.php" 2>/dev/null || true

    # The folders the application writes to have to exist and be writable
    # on a first deployment, or uploads fail with nothing in the log.
    - /bin/mkdir -p "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/storage/uploads" "$DEPLOYPATH/storage/backups"
    - /bin/chmod -R 755 "$DEPLOYPATH/storage" || true

    - echo "Deployed to $DEPLOYPATH — now open /upgrade.php to apply any pending database changes."
