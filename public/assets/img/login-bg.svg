<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Office interior">
  <!-- PLACEHOLDER ONLY.
       Save the office photograph as login-bg.jpg in this folder and it will
       be used instead — .jpg is checked before .svg. This stand-in exists so
       the sign-in page still looks deliberate before the photo is added. -->
  <rect width="1400" height="900" fill="#EEF1F4"/>

  <!-- ceiling -->
  <rect width="1400" height="210" fill="#F7F9FA"/>
  <rect y="205" width="1400" height="6" fill="#DFE5EA"/>
  <rect x="120" y="60" width="1160" height="26" rx="13" fill="#E4E9EE"/>
  <rect x="300" y="118" width="800" height="16" rx="8" fill="#E9EDF1"/>

  <!-- windows down the left -->
  <g fill="#CFDDE8">
    <rect x="24" y="230" width="150" height="300" rx="4"/>
    <rect x="204" y="240" width="130" height="270" rx="4"/>
    <rect x="364" y="250" width="110" height="240" rx="4"/>
  </g>
  <g fill="#B9CEDD">
    <rect x="24" y="230" width="150" height="150"/>
    <rect x="204" y="240" width="130" height="135"/>
    <rect x="364" y="250" width="110" height="120"/>
  </g>
  <g stroke="#F7F9FA" stroke-width="5">
    <line x1="99" y1="230" x2="99" y2="530"/>
    <line x1="24" y1="380" x2="174" y2="380"/>
    <line x1="269" y1="240" x2="269" y2="510"/>
    <line x1="204" y1="375" x2="334" y2="375"/>
  </g>

  <!-- floor -->
  <rect y="620" width="1400" height="280" fill="#D8DEE3"/>
  <rect y="620" width="1400" height="4" fill="#C3CBD2"/>

  <!-- desks -->
  <g>
    <rect x="60" y="560" width="470" height="18" rx="4" fill="#6E767E"/>
    <rect x="60" y="578" width="470" height="10" fill="#565D64"/>
    <rect x="96" y="588" width="14" height="86" fill="#4C535A"/>
    <rect x="480" y="588" width="14" height="86" fill="#4C535A"/>

    <rect x="600" y="540" width="360" height="15" rx="4" fill="#6E767E"/>
    <rect x="600" y="555" width="360" height="9" fill="#565D64"/>
    <rect x="630" y="564" width="12" height="70" fill="#4C535A"/>
    <rect x="920" y="564" width="12" height="70" fill="#4C535A"/>
  </g>

  <!-- monitors -->
  <g>
    <rect x="150" y="492" width="96" height="62" rx="5" fill="#3D444B"/>
    <rect x="156" y="498" width="84" height="50" rx="3" fill="#9FB4C4"/>
    <rect x="330" y="486" width="104" height="68" rx="5" fill="#3D444B"/>
    <rect x="336" y="492" width="92" height="56" rx="3" fill="#2FA8D8"/>
    <rect x="676" y="482" width="86" height="56" rx="5" fill="#3D444B"/>
    <rect x="682" y="488" width="74" height="44" rx="3" fill="#9FB4C4"/>
  </g>

  <!-- planters -->
  <g>
    <rect x="60" y="536" width="180" height="26" rx="4" fill="#8A9299"/>
    <rect x="64" y="524" width="172" height="16" fill="#5FA845"/>
    <rect x="290" y="530" width="150" height="22" rx="4" fill="#8A9299"/>
    <rect x="294" y="520" width="142" height="14" fill="#5FA845"/>
    <rect x="620" y="518" width="120" height="18" rx="4" fill="#8A9299"/>
    <rect x="624" y="510" width="112" height="11" fill="#5FA845"/>
  </g>

  <!-- chairs -->
  <g fill="#E7EAEC">
    <rect x="196" y="600" width="92" height="86" rx="12"/>
    <rect x="404" y="612" width="86" height="80" rx="12"/>
    <rect x="742" y="580" width="72" height="66" rx="10"/>
  </g>
  <g fill="#B9C0C6">
    <rect x="236" y="686" width="10" height="34"/>
    <rect x="442" y="692" width="10" height="30"/>
  </g>

  <!-- far wall + doorway -->
  <rect x="1080" y="150" width="12" height="500" fill="#E2E7EB"/>
  <rect x="1092" y="200" width="230" height="420" fill="#E9EDF0"/>
  <rect x="1150" y="290" width="60" height="46" rx="3" fill="#4C535A"/>
</svg>
